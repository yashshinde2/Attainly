<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#25345b" />
    <title>Offline · Attainly</title>
    <style>
      :root { color-scheme: light; font-family: Geist, Inter, ui-sans-serif, system-ui, sans-serif; background: #f7f7f2; color: #26314c; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; }
      main { width: min(100%, 440px); border: 1px solid #e4e3da; border-radius: 24px; background: #fffefa; padding: 32px; }
      .mark { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 14px; background: #25345b; color: white; font-weight: 700; }
      h1 { margin: 28px 0 8px; font-size: 26px; letter-spacing: -.04em; }
      p { color: #667085; line-height: 1.65; }
      a { display: inline-block; margin-top: 12px; border-radius: 12px; background: #25345b; padding: 11px 15px; color: white; font-size: 14px; font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body><main><div class="mark" aria-hidden="true">A</div><h1>You’re offline</h1><p>Attainly can’t connect right now. Check your connection and try again. Previously visited pages may still be available.</p><a href="/admin">Return to admin portal</a></main></body>
</html>
